<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRecall</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <h1>QRecall</h1>
      <div class="layout">
        <section class="panel" aria-labelledby="controls-title">
          <h2 id="controls-title">Message controls</h2>
          <label for="msg">Message</label>
          <textarea id="msg" rows="4">Exam paper: Q1. Prove that sqrt(2) is irrational.</textarea>
          <div class="actions">
            <button id="btn-send" type="button">Send</button>
            <button id="btn-recall" type="button" class="danger">Recall</button>
            <button id="btn-unlock" type="button" class="secondary">Unlock</button>
          </div>
          <p id="message-state" aria-live="polite">No message sent yet.</p>

          <div class="demo-controls">
            <h3>Quantum demos</h3>
            <label for="cheat-share">Cheating Bob: qubits kept for reading
              (<output id="cheat-share-value" for="cheat-share">30%</output>)
            </label>
            <input id="cheat-share" type="range" min="0" max="100" value="30" />
            <div class="actions">
              <button id="btn-eve" type="button" class="secondary">Try Eve's measurement</button>
              <button id="btn-leak" type="button" class="secondary">Leak key after recall</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="activity-title">
          <h2 id="activity-title">Activity Log</h2>
          <pre id="log" aria-live="polite" aria-label="Activity log">Ready.</pre>
        </section>
      </div>

      <section class="panel results-panel" aria-labelledby="results-title">
        <h2 id="results-title">Cheating-Bob experiment results</h2>
        <div class="chart-container">
          <div id="results-chart" aria-label="Average pad bits kept and proof mismatches by share of qubits measured in Z"></div>
        </div>
        <p id="results-caption" class="data-caption" aria-live="polite">Loading saved experiment results…</p>
      </section>

      <figure class="panel circuit-panel">
        <img src="/static/circuit.svg" alt="Quantum circuit for preparing, encoding, measuring, and reading qubits" />
        <figcaption>Quantum circuit used in the protocol: Alice prepares and encodes qubits, then Bob measures them.</figcaption>
      </figure>
    </main>
    <script src="/static/app.js"></script>
    <script src="/static/results.js"></script>
  </body>
</html>
